spring.application.name=coin
server.port=8080

spring.datasource.url=jdbc:h2:mem:coindb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

app.coindesk.url=https://kengp3.github.io/blog/coindesk.json
app.coindesk.connect-timeout-ms=5000
app.coindesk.read-timeout-ms=10000
# Time zone used when formatting the update time (e.g. UTC, Asia/Taipei)
app.coindesk.zone-id=UTC
